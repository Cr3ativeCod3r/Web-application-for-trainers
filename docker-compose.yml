services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=trainapp
      - POSTGRES_USER=trainuser
      - POSTGRES_PASSWORD=trainpass
    ports:
      - "5433:5432"

  # Database-per-service: the chat microservice owns this one exclusively.
  chat_db:
    image: postgres:15-alpine
    volumes:
      - chat_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chat
      - POSTGRES_USER=chat
      - POSTGRES_PASSWORD=${CHAT_DB_PASS:-chat}
    ports:
      - "5434:5432"

  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
      - ./secrets/jwt_private.pem:/run/secrets/jwt_private.pem:ro
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=core.settings
      - API_GEMINI=${API_GEMINI}
      - DB_HOST=db
      - DB_NAME=trainapp
      - DB_USER=trainuser
      - DB_PASS=${DB_PASS:-trainpass}
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_URL=redis://redis:6379/0
      - JWT_PRIVATE_KEY_FILE=/run/secrets/jwt_private.pem
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      - db
    command: >
      sh -c "until uv run python manage.py migrate; do echo 'Waiting for db...'; sleep 2; done &&
             uv run python manage.py createadmin &&
             uv run python manage.py publish_user_snapshots &&
             uv run python manage.py runserver 0.0.0.0:8000"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  celery_worker:
    build: .
    volumes:
      - .:/app
      - /app/.venv
      - ./secrets/jwt_private.pem:/run/secrets/jwt_private.pem:ro
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=core.settings
      - DB_HOST=db
      - DB_NAME=trainapp
      - DB_USER=trainuser
      - DB_PASS=${DB_PASS:-trainpass}
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_URL=redis://redis:6379/0
      - JWT_PRIVATE_KEY_FILE=/run/secrets/jwt_private.pem
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
    depends_on:
      - db
      - redis
    command: >
      sh -c "uv run celery -A core worker -l info"

  celery_beat:
    build: .
    volumes:
      - .:/app
      - /app/.venv
      - ./secrets/jwt_private.pem:/run/secrets/jwt_private.pem:ro
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - DB_HOST=db
      - DB_NAME=trainapp
      - DB_USER=trainuser
      - DB_PASS=${DB_PASS:-trainpass}
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_URL=redis://redis:6379/0
      - JWT_PRIVATE_KEY_FILE=/run/secrets/jwt_private.pem
    depends_on:
      - redis
    command: >
      sh -c "uv run celery -A core beat -l info --schedule /tmp/celerybeat-schedule"

  chat:
    build: ./chat
    ports:
      - "8001:8001"
    volumes:
      - ./chat:/app
      - /app/.venv
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    environment:
      - DATABASE_URL=postgresql+asyncpg://chat:${CHAT_DB_PASS:-chat}@chat_db:5432/chat
      - REDIS_URL=redis://redis:6379/0
      # Only the public key: the chat service can verify tokens, not issue them.
      - JWT_PUBLIC_KEY_FILE=/run/secrets/jwt_public.pem
      - CHAT_CORS_ORIGINS=${CHAT_CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    depends_on:
      - chat_db
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready')"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8001 --reload"
volumes:
  postgres_data:
  chat_postgres_data:

